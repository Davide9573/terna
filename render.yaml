# Render.com Blueprint — deploys the Terna Energy Simulator as a single free web service.
# Docs: https://render.com/docs/blueprint-spec
#
# What happens on each deploy:
#   1. Docker builds the React frontend and the C++ simulation extension.
#   2. The runtime image regenerates power_2025.npz from the CSV files.
#   3. FastAPI (uvicorn) starts and serves both the API and the built frontend.
#
# Free tier note: the service spins down after ~15 min of inactivity and takes
# ~30 s to cold-start on the next request — fine for a demo/educational app.

services:
  - type: web
    name: terna
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
